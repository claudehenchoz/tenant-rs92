# Vendored from nih-plug (rev de421011f41a6d10fc8c7a6084e4f4dee0143683), ISC licence (LICENSE).
# See the deviations listed at the top of src/lib.rs.
[package]
name = "nih_plug_egui"
version = "0.0.0"
edition = "2021"
authors = ["Robbert van der Helm <mail@robbertvanderhelm.nl>"]
license = "ISC"
publish = false

description = "An adapter to use egui GUIs with NIH-plug"

[features]
default = ["opengl", "default_fonts"]
# `nih_plug_egui` always uses OpenGL since egui's wgpu backend is still unstable
# depending on the platform
opengl = ["egui-baseview/opengl"]
default_fonts = ["egui-baseview/default_fonts"]

[dependencies]
nih_plug.workspace = true
raw-window-handle = "0.5"
baseview = { git = "https://github.com/RustAudio/baseview.git", rev = "9a0b42c09d712777b2edb4c5e0cb6baf21e988f0" }
crossbeam = "0.8"
# Vendored with a zoom fix; see crates/egui-baseview/src/lib.rs.
egui-baseview = { path = "../egui-baseview" }
parking_lot = "0.12"
# To make the state persistable
serde = { version = "1.0", features = ["derive"] }
